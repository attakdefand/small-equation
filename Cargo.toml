[package]
name = "trillion-dollar-equation"
version = "0.1.0"
edition = "2024"

[lib]
name = "trillion_dollar_equation"
path = "src/lib.rs"

[[bin]]
name = "trillion-dollar-equation"
path = "src/main.rs"

[[example]]
name = "database_example"
path = "examples/database_example.rs"

[dependencies]
# Mathematical functions and constants
num = "0.4"
# Statistical distributions
statrs = "0.16"
# Serialization support
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Random number generation
rand = "0.8"
rand_distr = "0.4"
# Parallel processing
rayon = "1.5"
# Database support
rusqlite = { version = "0.28", features = ["bundled"] }
tokio-postgres = "0.7"
# ORM support
diesel = { version = "2.0", features = ["sqlite", "postgres", "r2d2"] }
# Database migrations
refinery = { version = "0.8", features = ["rusqlite"] }
# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# Testing framework
criterion = "0.4"