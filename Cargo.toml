[package]
name = "trillion-dollar-equation"
version = "0.1.0"
edition = "2024"

[lib]
name = "trillion_dollar_equation"
path = "src/lib.rs"

[[bin]]
name = "trillion-dollar-equation"
path = "src/main.rs"

[dependencies]
# Mathematical functions and constants
num = "0.4"
# Statistical distributions
statrs = "0.16"
# Serialization support
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
